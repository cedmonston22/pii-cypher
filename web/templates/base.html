<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PII Scrubber{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
  /* Slate blue, light only. A deliberate single look rather than an omission:
     every colour is a token here and nothing is declared outside this block.
     color-scheme pins the native chrome -- the select popup and the scrollbars
     -- to light as well, which prefers-color-scheme alone would not do. */
  :root {
    color-scheme: light;
    --bg:#eceef1; --surface:#ffffff; --well:#f4f5f8;
    --ink:#14171d; --ink-2:#3b414d; --muted:#5a616e;
    --line:#d8dce3; --line-strong:#c0c6d0; --edge-dash:#b4bcc8;
    --accent:#1f5fbf; --accent-hover:#17509f; --accent-soft:#e6edf9;
    --accent-edge:#b4cbee; --on-accent:#ffffff;
    --good:#1e7a45; --good-soft:#e7f3ec;
    --caution-ink:#7a5210; --caution-line:#c9ad7e; --caution-soft:#fdf6e9;
    --bad:#b3271b; --bad-soft:#fceceb; --bad-line:#e7bab5;
    --shadow-flat:0 1px 0 rgba(20,23,29,.03);
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    --serif:"Newsreader",Georgia,"Times New Roman",serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
  .sr-only {
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  [x-cloak] { display:none !important; }

  /* ------------------------------ top bar ------------------------------ */
  header.topbar { background:var(--surface); border-bottom:1px solid var(--line); }
  header .inner {
    max-width:1240px; margin:0 auto; padding:0 40px;
    display:flex; align-items:stretch; gap:36px;
  }
  .wordmark {
    display:flex; align-items:center; gap:10px; padding:17px 0;
    font-size:12.5px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink); white-space:nowrap;
    text-decoration:none;
  }
  .wordmark svg { width:18px; height:18px; color:var(--accent); flex:none; }
  nav.tabs { display:flex; gap:2px; }
  nav.tabs a {
    display:flex; align-items:center; padding:0 15px; margin-bottom:-1px;
    border-bottom:2px solid transparent; color:var(--muted);
    text-decoration:none; font-size:14px; font-weight:500;
  }
  nav.tabs a:hover { color:var(--ink); }
  nav.tabs a[aria-current="page"] {
    color:var(--ink); font-weight:600; border-bottom-color:var(--accent);
  }

  /* ------------------------------- shell ------------------------------- */
  main { max-width:1240px; margin:0 auto; padding:44px 40px 96px; }
  h1 { font-family:var(--serif); font-weight:500; font-size:30px; line-height:1.15; margin:0 0 10px; }
  h2 { font-size:16px; margin:26px 0 10px; }
  p.lede { color:var(--muted); margin:0 0 24px; max-width:62ch; }

  .card, .panel {
    background:var(--surface); border:1px solid var(--line);
    border-radius:6px; box-shadow:var(--shadow-flat);
  }
  .panel { padding:20px; }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  .muted { color:var(--muted); }
  code, .mono { font-family:var(--mono); font-size:13px; }

  /* Retained for the result and restore pages, remapped onto the new tokens. */
  .jobid {
    display:inline-block; background:var(--accent-soft); border:1px solid var(--accent-edge);
    border-radius:6px; padding:8px 12px;
  }
  .callout { border-radius:6px; padding:14px 16px; margin:18px 0; border:1px solid; }
  .callout.warn { background:var(--caution-soft); border-color:var(--caution-line); }
  .callout.bad { background:var(--bad-soft); border-color:var(--bad-line); }
  .callout h2 { margin-top:0; }
  .ok { color:var(--good); font-weight:600; }
  ul.tokens { margin:6px 0 0; padding-left:20px; }

  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th {
    font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.11em;
    text-transform:uppercase; color:var(--muted);
  }

  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text] {
    width:100%; padding:9px 10px; border:1px solid var(--line-strong);
    border-radius:6px; background:var(--surface); color:var(--ink); font:inherit;
  }
  input[type=checkbox] {
    appearance:none; -webkit-appearance:none; width:17px; height:17px; margin:0;
    flex:none; border:1px solid var(--line-strong); border-radius:4px;
    background:var(--surface); cursor:pointer; display:grid; place-content:center;
    transition:background-color .12s ease, border-color .12s ease;
  }
  input[type=checkbox]:hover { border-color:var(--accent); }
  input[type=checkbox]:checked { background:var(--accent); border-color:var(--accent); }
  input[type=checkbox]::after {
    content:""; width:9px; height:9px; transform:scale(0); background:var(--on-accent);
    clip-path:polygon(14% 46%, 0 60%, 38% 96%, 100% 22%, 85% 8%, 37% 66%);
    transition:transform .12s ease;
  }
  input[type=checkbox]:checked::after { transform:scale(1); }
  select {
    font:inherit; font-size:13px; padding:6px 30px 6px 10px; min-width:78px;
    border:1px solid var(--line-strong); border-radius:5px;
    background:var(--surface); color:var(--ink); cursor:pointer;
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%235a616e' stroke-width='1.4' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 9px center; background-size:11px 11px;
  }
  button, .btn, .dl {
    font:inherit; font-size:14px; font-weight:500; cursor:pointer;
    padding:9px 18px; border-radius:6px; border:1px solid var(--line-strong);
    background:var(--surface); color:var(--ink); text-decoration:none;
    display:inline-flex; align-items:center; gap:7px;
    transition:border-color .12s ease, background-color .12s ease, color .12s ease;
  }
  button:hover, .btn:hover { border-color:var(--accent); color:var(--accent); }
  .dl:hover { color:var(--on-accent); }
  .btn-primary, .dl {
    background:var(--accent); border-color:var(--accent); color:var(--on-accent);
    font-weight:600; font-size:15px; padding:11px 26px;
  }
  .btn-primary:hover, .dl:hover {
    background:var(--accent-hover); border-color:var(--accent-hover); color:var(--on-accent);
  }
  .btn-primary:disabled { opacity:.45; cursor:not-allowed; }
  .btn-ghost { border-color:transparent; background:transparent; color:var(--muted); font-size:13px; padding:5px 10px; }
  .btn-ghost:hover { color:var(--ink); border-color:var(--line-strong); }
</style>
<script defer src="/static/alpine-3.14.9.min.js"></script>
{% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <div class="inner">
    <a class="wordmark" href="/">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 1.6 17 4.3v5.2c0 4.1-2.8 7.4-7 8.9-4.2-1.5-7-4.8-7-8.9V4.3L10 1.6Z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M7 9.7h6M7 12.4h3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      PII Scrubber
    </a>
    <nav class="tabs" aria-label="Primary">
      <a href="/"{% if nav == 'scrub' %} aria-current="page"{% endif %}>Scrub</a>
      <a href="/restore"{% if nav == 'restore' %} aria-current="page"{% endif %}>Restore</a>
      <a href="/jobs"{% if nav == 'history' %} aria-current="page"{% endif %}>History</a>
      <a href="/settings"{% if nav == 'settings' %} aria-current="page"{% endif %}>Settings</a>
    </nav>
  </div>
</header>
<main>
{% if error %}<div class="callout bad"><strong>{{ error }}</strong></div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
