<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PII Scrubber{% endblock %}</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #16181d; --muted: #5f6570;
    --line: #dfe3e8; --accent: #1f5fbf; --warn-bg: #fff5e6; --warn-line: #e0a03a;
    --bad-bg: #fdeeee; --bad-line: #c0392b; --good: #1e7a45;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  header .inner { max-width: 860px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 22px; align-items: baseline; }
  header strong { font-size: 16px; }
  header a { color: var(--muted); text-decoration: none; }
  header a:hover { color: var(--accent); }
  main { max-width: 860px; margin: 28px auto 60px; padding: 0 20px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  p.lede { color: var(--muted); margin: 0 0 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=file] {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; font: inherit;
  }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  button {
    margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #17509f; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .jobid { display: inline-block; background: #eef3fb; border: 1px solid #cbdcf5; border-radius: 6px; padding: 8px 12px; }
  .callout { border-radius: 8px; padding: 14px 16px; margin: 18px 0; border: 1px solid; }
  .callout.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .callout.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .callout h2 { margin-top: 0; }
  .ok { color: var(--good); font-weight: 600; }
  .dl { display: inline-block; margin-top: 14px; padding: 10px 18px; background: var(--accent);
        color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; }
  ul.tokens { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
<header>
  <div class="inner">
    <strong>PII Scrubber</strong>
    <a href="/">Scrub</a>
    <a href="/restore">Restore</a>
    <a href="/jobs">Jobs</a>
  </div>
</header>
<main>
{% if error %}<div class="callout bad"><strong>{{ error }}</strong></div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
